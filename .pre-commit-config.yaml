repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  
  - repo: local
    hooks:
      - id: forbid-files
        name: Prevent committing sensitive files # just in case 😳
        entry: run-hook forbid-files
        language: python
      - id: run-tests
        name: Run tests before pushing
        entry: pytest
        language: system
        types: [python]
        stages: [pre-push]
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
